[package]
name = "paper-os-desktop"
version = "0.4.0"
description = "Paper OS — Editorial LaTeX editor with local compile and AI"
authors = ["Paper OS Team"]
edition = "2021"

[[bin]]
name = "paper-os-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = "2"
which = "6"
dirs = "5"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
